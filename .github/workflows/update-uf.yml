name: Actualizar UF

on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-uf:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Actualizar cache UF
        run: node scripts/update-uf-cache.mjs

      - name: Guardar cambio si existe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uf-cache.json
          git diff --cached --quiet || git commit -m "Actualizar UF diaria"
          git push
